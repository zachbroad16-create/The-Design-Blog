name: Refresh and deploy

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, at a quiet minute
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed parser
        run: pip install -r requirements.txt

      - name: Test the parser
        run: python tests/test_fetch.py

      - name: Fetch feeds
        run: python scripts/fetch_feeds.py

      - name: Commit new stories
        run: |
          if git diff --quiet data/articles.json; then
            echo "No new stories."
          else
            git config user.name "design-blog-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/articles.json
            git commit -m "Refresh stories"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
